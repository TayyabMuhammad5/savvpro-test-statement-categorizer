- rule_id: KW_CAMERA_LENS
  pattern: \b(CAMERA|MEDIUM\s*FORMAT|ANALOG\s*FILM|DARKROOM|TRIPOD|STROBE|LIGHTMETER|35MM|120\s*FILM)\b
  category: Camera Equipment & Lighting
  base_confidence: 0.80
  explanation: Matched photography equipment keyword heuristic.
  default_type: expense
  tax_flag: NONE
  positive_examples:
    - LOCAL CAMERA REPAIR SHOP
    - VINTAGE 35MM SUPPLIES
  negative_examples:
    - STARBUCKS COFFEE
    - DELTA AIR LINES

